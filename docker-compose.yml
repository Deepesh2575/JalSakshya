version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: jalsakshya-db
    environment:
      POSTGRES_DB: jalsakshya
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jalsakshya-backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/jalsakshya
      - API_V1_STR=/api/v1
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jalsakshya-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
